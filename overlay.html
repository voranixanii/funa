<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Funa Overlay PRO</title>

<style>
body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  overflow: hidden;
  background: transparent;
}

/* CONTENEDOR */
#funaBox {
  position: absolute;
  bottom: 80px;
  left: 50px;
  background: linear-gradient(135deg, #7b2cff, #c50000);
  padding: 20px 30px;
  border-radius: 20px;
  color: white;
  box-shadow: 0 0 25px rgba(123,44,255,0.6);
  animation: slideIn 0.5s ease;
}

/* TEXTO */
#user {
  font-size: 24px;
  font-weight: bold;
}

#motivo {
  font-size: 16px;
  opacity: 0.9;
}

#contador {
  margin-top: 10px;
  font-size: 18px;
}

/* ALERTA */
#alerta {
  position: absolute;
  top: 35%;
  width: 100%;
  text-align: center;
  font-size: 60px;
  color: red;
  display: none;
  animation: boom 0.4s ease;
  text-shadow: 0 0 20px red;
}

/* ANIMACIONES */
@keyframes slideIn {
  from { transform: translateX(-200px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes boom {
  from { transform: scale(0.5); }
  to { transform: scale(1); }
}
</style>
</head>

<body>

<div id="funaBox">
  <div id="user">Esperando funa...</div>
  <div id="motivo"></div>
  <div id="contador"></div>
</div>

<div id="alerta">💀 FUNA MÁXIMA 💀</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

socket.on('nuevaFuna', (data) => {
  document.getElementById('user').innerText = `🚨 ${data.user}`;
  document.getElementById('motivo').innerText = data.motivo;
  document.getElementById('contador').innerText = `Nivel de funa: ${data.total}`;
});

socket.on('alertaFuna', () => {
  const alerta = document.getElementById('alerta');
  alerta.style.display = 'block';

  setTimeout(() => {
    alerta.style.display = 'none';
  }, 3000);
});
</script>

</body>
</html>
