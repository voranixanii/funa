<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Funa Overlay PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Orbitron', sans-serif;
  background: transparent;
}

/* FUNA BOX */
#funaBox {
  position: absolute;
  bottom: 80px;
  left: 50px;
  background: linear-gradient(135deg, #7b2cff, #8f0000);
  padding: 20px 30px;
  border-radius: 20px;
  color: white;
  box-shadow: 0 0 25px rgba(123,44,255,0.7);
  min-width: 320px;

  opacity: 0;
  transform: translateY(20px);
  transition: all 0.4s ease;
}

#funaBox.show {
  opacity: 1;
  transform: translateY(0);
}

#user {
  font-size: 26px;
  font-weight: bold;
}

#motivo {
  font-size: 16px;
  opacity: 0.9;
  margin-top: 5px;
}

#contador {
  margin-top: 8px;
  font-size: 16px;
}

/* ALERTA */
#alerta {
  position: absolute;
  top: 35%;
  width: 100%;
  text-align: center;
  font-size: 70px;
  display: none;
  text-shadow: 0 0 20px red;
  animation: boom 0.3s ease;
}

/* PROMO */
#promoBox {
  position: absolute;
  top: 80px;
  right: 50px;
  background: rgba(0,0,0,0.85);
  padding: 15px;
  border-radius: 15px;
  display: none;
  align-items: center;
  gap: 10px;
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
}

#promoAvatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
}

#promoText {
  color: white;
  font-size: 18px;
}

/* ANIMACIONES */
@keyframes boom {
  from { transform: scale(0.6); }
  to { transform: scale(1); }
}

.flash {
  animation: flashBg 0.2s alternate 6;
}

@keyframes flashBg {
  from { background: rgba(255,0,0,0.1); }
  to { background: rgba(255,0,0,0.4); }
}
</style>
</head>

<body>

<div id="funaBox">
  <div id="user">Esperando funa...</div>
  <div id="motivo"></div>
  <div id="contador"></div>
</div>

<div id="alerta">💀 FUNA MÁXIMA 💀</div>

<div id="promoBox">
  <img id="promoAvatar">
  <div id="promoText"></div>
</div>

<audio id="sonido" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io({
  transports: ['websocket'],
  reconnection: true,
  reconnectionAttempts: Infinity
});

let box = document.getElementById('funaBox');

function showBox() {
  box.classList.add('show');
}

function hideBox() {
  box.classList.remove('show');
}

function getTitulo(nivel) {
  if (nivel >= 20) return '💀 ELIMINADO';
  if (nivel >= 15) return '🚨 PELIGRO PÚBLICO';
  if (nivel >= 10) return '🔥 FUNADO';
  if (nivel >= 5) return '🤨 SOSPECHOSO';
  return '😇 INOCENTE';
}

// FUNA
socket.on('nuevaFuna', (data) => {
  showBox();

  document.getElementById('user').innerText = `🚨 ${data.user}`;
  document.getElementById('motivo').innerText = data.motivo;
  document.getElementById('contador').innerText =
    `Nivel: ${data.total} | ${getTitulo(data.total)}`;

  const audio = document.getElementById('sonido');
  audio.currentTime = 0;
  audio.play().catch(() => {});
});

// ALERTAS
socket.on('alertaFuna', (data) => {
  const alerta = document.getElementById('alerta');

  let texto = "💀 TERRIBLE 💀";

  if (data.nivel === 10) texto = "🔥 FUNA EN PROGRESO 🔥";
  if (data.nivel === 15) texto = "🚨 PELIGRO PÚBLICO 🚨";
  if (data.nivel === 20) texto = "💀 BAN TEMPORAL 💀";

  alerta.innerText = texto;
  alerta.style.display = 'block';

  document.body.classList.add('flash');

  setTimeout(() => {
    alerta.style.display = 'none';
    document.body.classList.remove('flash');
  }, 3000);
});

// PROMO
socket.on('promo', (data) => {
  const box = document.getElementById('promoBox');

  document.getElementById('promoAvatar').src = data.avatar;

  document.getElementById('promoText').innerText =
    data.raid
      ? `🔥 RAID de ${data.user} (${data.viewers}) 🔥`
      : `¡Sigan a ${data.user}! 🔥`;

  box.style.display = 'flex';

  setTimeout(() => {
    box.style.display = 'none';
  }, 7000);
});

// RESET
socket.on('resetFunas', () => {
  hideBox();
  document.getElementById('user').innerText = 'Esperando funa...';
  document.getElementById('motivo').innerText = '';
  document.getElementById('contador').innerText = '';
});

socket.on('resetUser', (data) => {
  showBox();
  document.getElementById('user').innerText = `${data.user} fue perdonado 🙏`;
  document.getElementById('motivo').innerText = '';
  document.getElementById('contador').innerText = '';
});
</script>

</body>
</html>
